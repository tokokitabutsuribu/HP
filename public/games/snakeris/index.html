<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Snakeris</title>
        <style>
            body{
                padding:20px;
                display:flex;
                justify-content:center;
            }
            canvas{
                border: 1px solid;
            }
            .data{
                margin: 0 auto;
                padding: 1em 0;
                width: 100px;
                border: 1px solid;
                margin-bottom: 2em;
                text-align: center;
            }
            .panel{
                margin-left:20px;
                font-family:sans-serif;
                font-size:large;
            }
        </style>
    </head>
    <body>
        <canvas id="board" width="300" height="600"></canvas>
        <div class="panel">
            SCORE:
            <div class="data" id="score">0</div>
            LINE:
            <div class="data" id="line">0</div>
            LEVEL:
            <div class="data" id="level">1</div>
        </div>
        <div style="display:none;">
            <img src="img/game_over.png">
            <img src="img/apple.png">
        </div>
        <script src="script.js"></script>
    </body>
</html>
